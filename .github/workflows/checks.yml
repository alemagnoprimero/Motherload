name: Verify campaign improvements

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"

permissions:
  contents: read

concurrency:
  group: campaign-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --maxWorkers=2
      - run: npm run format:check
      - run: npm run build
      - name: Install browser and pixel measurement tooling
        run: |
          npx playwright-core install --with-deps chromium
          python3 -m pip install Pillow==12.0.0 numpy==2.5.3
      - name: Rebuild the campaign assets from their sources, byte for byte
        # Audit T13b: resvg (@resvg/resvg-js, pinned) rasterizes the SVG
        # sources without a browser, Pillow 12.0.0 packs them, and
        # scripts/png-canonical.mjs (pako, pinned) encodes every PNG, so the
        # committed bytes depend on neither a browser nor a machine's zlib.
        env:
          PYTHON: python3
        run: |
          npm run assets:rebuild
          changes="$(git status --porcelain --untracked-files=all -- assets/campaign)"
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff --stat -- assets/campaign
            mkdir -p artifacts/asset-rebuild
            git ls-files -z --modified --others --exclude-standard -- assets/campaign \
              | xargs -0 -r cp --parents -t artifacts/asset-rebuild
            echo "::error::assets/campaign differs from a rebuild of its sources. Run PYTHON=python3 npm run assets:rebuild and commit the result; CI's rebuilt files are in the rebuilt-campaign-assets artifact."
            exit 1
          fi
      - name: Retain the rebuilt assets
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rebuilt-campaign-assets
          path: artifacts/asset-rebuild/
          if-no-files-found: ignore
      - name: Start isolated source preview
        run: |
          npm run dev -- --port 5173 --strictPort > /tmp/motherload-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/motherload-vite.log
          exit 1
      - name: Check campaign improvements and atomic save storage
        env:
          PREVIEW_URL: http://127.0.0.1:5173/
          # harness: the §9 fixtures at backing 1 (audit F3). The nightly runs
          # them at backing 2 in visual-sheets instead.
          IMPROVEMENT_CHECKS: ${{ github.event_name == 'schedule' && 'behavior,visual,fog,sky,perf' || 'behavior,visual,fog,harness' }}
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import { chromium } from "playwright-core"; process.stdout.write(chromium.executablePath());')"
          npm run test:improvements
          npm run test:campaign:storage
          npm run test:feel
          npm run test:audio
          npm run test:plan-ui
          npm run test:render
          npm run test:render:memory
          npm run test:camera
          npm run test:hud:surface
          npm run test:opening:browser
          AUDIT_VIEWPORT=portrait OPENING_ARTIFACTS=artifacts/audit-opening-portrait npm run test:opening:browser
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: improvement-evidence
          path: |
            artifacts/improvement/
            artifacts/improvement-*/
            artifacts/pacing/
            artifacts/feel/
            artifacts/audio/
            artifacts/plan-ui/
            artifacts/render-*/
            artifacts/camera-*/
            artifacts/hud-surface*/
            artifacts/audit-opening*/
          if-no-files-found: ignore
  visual-sheets:
    # Audit F3: the §9.1 sheets and the §9.2 table at backing 2 on the
    # schedule (and manual runs, like pacing), never on pull requests, with
    # its own timeout; pull requests run the fixtures at backing 1 inside
    # verify. It also reports how the dark shares in pixels.json spread across
    # the last seven nightly runs.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install browser and pixel measurement tooling
        run: |
          npx playwright-core install --with-deps chromium
          python3 -m pip install Pillow==12.0.0 numpy==2.5.3
      - name: Start isolated source preview
        run: |
          npm run dev -- --port 5173 --strictPort > /tmp/motherload-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/motherload-vite.log
          exit 1
      - name: Capture the §9 fixtures at backing 2
        env:
          PREVIEW_URL: http://127.0.0.1:5173/
          ART_BACKING: "2"
          ART_CAPTURES_DIR: artifacts/visual-sheets/captures
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import { chromium } from "playwright-core"; process.stdout.write(chromium.executablePath());')"
          node scripts/art-captures.mjs
      - name: Check the ported measures against metrics.py
        # Also run per pull request, but pull requests that change only docs
        # skip verify, and the panels, metrics.py and fresh-w01.json are docs.
        run: |
          python3 scripts/art-metrics-check.py \
            "artifacts/visual-sheets/captures/a04-dive-60m@2-hudfree.png" \
            "artifacts/visual-sheets/captures/c-site-W01-SITE-4-wreck@2-hudfree.png"
      - name: Fetch pixels.json from the last seven nightly runs
        # The spread is secondary: an API failure here must not stop the
        # sheets and the table (art-sheets.py reports an empty history).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          history="$RUNNER_TEMP/nightly"
          mkdir -p "$history"
          cd "$history"
          # Newest first. Runs whose verify stopped before the visual section
          # have no pixels.json; keep the first seven that do.
          gh run list --repo "$GITHUB_REPOSITORY" --workflow checks.yml --event schedule \
            --limit 20 --json databaseId,createdAt,headSha > runs.json || echo '[]' > runs.json
          found=0
          for id in $(jq -r '.[].databaseId' runs.json); do
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n improvement-evidence -D "$id" > /dev/null 2>&1 \
              && [ -f "$id/improvement/pixels.json" ]; then
              find "$id" -type f ! -path "*/improvement/pixels.json" -delete
              found=$((found + 1))
            else
              rm -rf "$id"
            fi
            if [ "$found" -ge 7 ]; then break; fi
          done
          echo "pixels.json from $found nightly run(s)"
      - name: Build the §9.1 sheets, the §9.2 table and the dark-share spread
        run: |
          python3 scripts/art-sheets.py --captures artifacts/visual-sheets/captures \
            --out artifacts/visual-sheets --history "$RUNNER_TEMP/nightly" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the sheets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-sheets
          path: artifacts/visual-sheets/
          if-no-files-found: ignore
  pacing:
    # Nightly and manual only: the guardrails fail for an open balance reason
    # ("Pacing calibration (open)" in docs/IMPROVEMENT_PROGRESS.md).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        policy: ${{ github.event_name == 'schedule' && fromJSON('["rusher","skilled","novice","guided-skilled","guided-novice"]') || fromJSON('["all"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Calibrated pacing and native return paths
        env:
          PACING_POLICIES: ${{ matrix.policy }}
        run: ${{ github.event_name == 'schedule' && 'npm run test:pacing:nightly' || 'npm run test:pacing' }}
      - name: Retain every pacing seed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pacing-evidence-${{ matrix.policy }}
          path: artifacts/pacing/
          if-no-files-found: ignore
