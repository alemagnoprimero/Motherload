name: Verify campaign improvements

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"

permissions:
  contents: read

concurrency:
  group: campaign-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --maxWorkers=2
      - run: npm run format:check
      - run: npm run build
      - name: Install browser and pixel measurement tooling
        run: |
          npx playwright-core install --with-deps chromium
          python3 -m pip install Pillow==12.0.0
      - name: Start isolated source preview
        run: |
          npm run dev -- --port 5173 --strictPort > /tmp/motherload-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/motherload-vite.log
          exit 1
      - name: Check campaign improvements and atomic save storage
        env:
          PREVIEW_URL: http://127.0.0.1:5173/
          IMPROVEMENT_CHECKS: ${{ github.event_name == 'schedule' && 'behavior,visual,fog,sky,perf' || 'behavior,visual,fog' }}
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import { chromium } from "playwright-core"; process.stdout.write(chromium.executablePath());')"
          npm run test:improvements
          npm run test:campaign:storage
          npm run test:feel
          npm run test:audio
          npm run test:plan-ui
          npm run test:render
          npm run test:render:memory
          npm run test:camera
          npm run test:hud:surface
          npm run test:opening:browser
          AUDIT_VIEWPORT=portrait OPENING_ARTIFACTS=artifacts/audit-opening-portrait npm run test:opening:browser
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: improvement-evidence
          path: |
            artifacts/improvement/
            artifacts/improvement-*/
            artifacts/pacing/
            artifacts/feel/
            artifacts/audio/
            artifacts/plan-ui/
            artifacts/render-*/
            artifacts/camera-*/
            artifacts/hud-surface*/
            artifacts/audit-opening*/
          if-no-files-found: ignore
  pacing:
    # Nightly and manual only: the guardrails fail for an open balance reason
    # ("Pacing calibration (open)" in docs/IMPROVEMENT_PROGRESS.md).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        policy: ${{ github.event_name == 'schedule' && fromJSON('["rusher","skilled","novice","guided-skilled","guided-novice"]') || fromJSON('["all"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Calibrated pacing and native return paths
        env:
          PACING_POLICIES: ${{ matrix.policy }}
        run: ${{ github.event_name == 'schedule' && 'npm run test:pacing:nightly' || 'npm run test:pacing' }}
      - name: Retain every pacing seed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pacing-evidence-${{ matrix.policy }}
          path: artifacts/pacing/
          if-no-files-found: ignore
