name: T2 field renderer checks

# The field renderer's own checks (scripts/t2-field.mjs; docs/qa/t2/README.md):
# which renderer a page gets, the full-frame scramble and the POI probe at
# 0 px, patch uploads, the reveal and dig transitions, draw calls and WebGL
# context loss. CI has no GPU: every check pins the field with ?field=1, and
# the dig cost is reported but not asserted (shared runners time unevenly).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/campaign/**"
      - "assets/campaign/**"
      - "scripts/t2-*"
      - "scripts/art-captures.mjs"
      - "scripts/campaign-smoke.mjs"
      - "scripts/improvement-smoke.mjs"
      - "scripts/render-probe.mjs"
      - "scripts/browser-launch.mjs"
      - ".github/workflows/t2-field.yml"
      - "package*.json"

permissions:
  contents: read

concurrency:
  group: t2-field-${{ github.ref }}
  cancel-in-progress: true

jobs:
  field:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install browser and pixel measurement tooling
        run: |
          npx playwright-core install --with-deps chromium
          python3 -m pip install Pillow==12.0.0 numpy==2.5.3
      - name: Start isolated source preview
        run: |
          npm run dev -- --port 5173 --strictPort > /tmp/motherload-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/motherload-vite.log
          exit 1
      - name: Check the field renderer
        env:
          PREVIEW_URL: http://127.0.0.1:5173/
          T2_DIGCOST_ASSERT: "0"
          T2_DIG_FRAMES: "300"
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import { chromium } from "playwright-core"; process.stdout.write(chromium.executablePath());')"
          npm run test:t2
      - name: Retain the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-field-evidence
          path: artifacts/t2/
          if-no-files-found: ignore
