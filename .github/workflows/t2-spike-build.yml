name: T2 spike static build

# The T2 field-renderer spike (docs/qa/t2-spike/README.md): a static build of
# this branch for a phone or a remote device lab. Serve the unzipped artifact
# at the web root and open /?field=1&debug=frametime&backing=1.5.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t2-spike-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'claude/t2-field-spike'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Retain the static build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t2-spike-dist
          path: dist/
          retention-days: 30
          if-no-files-found: error
